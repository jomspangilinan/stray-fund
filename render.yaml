# Render blueprint. The background worker is added in a later task.
services:
  - type: web
    name: stray-fund
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stray-fund-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: "22"

databases:
  - name: stray-fund-db
    region: singapore
    plan: basic-256mb
    databaseName: strayfund
