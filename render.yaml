# Render blueprint. Plan names are unverified until the first deploy.
services:
  - type: web
    name: stray-fund
    runtime: node
    region: singapore
    plan: starter
    # NODE_ENV=production would make npm ci skip the devDependencies the build needs.
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stray-fund-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: NODE_VERSION
        value: "22"
      - key: AI_DAILY_CALL_CAP
        sync: false

  # The treasurer: claims wakeups, calls Bedrock, and keeps payouts in step with PayPal.
  - type: worker
    name: stray-fund-worker
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    # SIGTERM lets the current wakeup finish. A run has an 8 minute deadline, past this limit
    # the platform kills it and another worker reclaims the wakeup after 10 minutes.
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stray-fund-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: AWS_REGION
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_DAILY_CALL_CAP
        sync: false
      - key: S3_PRIVATE_BUCKET
        sync: false
      - key: S3_PUBLIC_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

databases:
  - name: stray-fund-db
    region: singapore
    plan: basic-256mb
    databaseName: strayfund
