# Render Blueprint. Plan names checked against https://render.com/docs/blueprint-spec and the
# published schema at https://render.com/schema/render.yaml.json. See docs/deploy.md for setup.
services:
  - type: web
    name: stray-fund
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    # NODE_ENV=production would make npm ci skip the devDependencies the build needs.
    buildCommand: npm ci --include=dev && npm run build
    # Runs once per deploy, after the build and before the new version takes traffic.
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # onnxruntime-node's install would otherwise fetch its CUDA libraries on Linux x64. Both services run on CPU.
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      - key: DATABASE_URL
        fromDatabase:
          name: stray-fund-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FEEDER_TOKEN
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: AWS_REGION
        value: ap-southeast-1
      # No AWS keys: Render's OIDC token assumes this IAM role (needs a Pro workspace). Render sets
      # AWS_WEB_IDENTITY_TOKEN_FILE itself; never set it by hand. See docs/deploy.md step 2.
      - key: AWS_ROLE_ARN
        sync: false
      # The Bedrock policy in docs/deploy.md names this exact model in three statements. Change all of them with it.
      - key: AI_MODEL
        value: global.anthropic.claude-haiku-4-5-20251001-v1:0
      - key: AI_DAILY_CALL_CAP
        value: "100"
      - key: S3_PRIVATE_BUCKET
        sync: false
      - key: S3_PUBLIC_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # Never set to production here. Live money needs its own PayPal app and a hand-set value (docs/deploy.md, Before real money).
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_VET_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # The private judge link code (/judge?code=...). Typed into the dashboard by the owner; never in the repo.
      - key: JUDGE_PASSCODE
        sync: false
      # Set to "true" by the owner when the judge gate should switch on; anything else means no gate.
      - key: JUDGE_GATE
        sync: false

  # The treasurer: claims wakeups, calls Bedrock, and keeps payouts in step with PayPal.
  - type: worker
    name: stray-fund-worker
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    # tsx is a runtime dependency, so a plain npm ci is enough.
    buildCommand: npm ci
    startCommand: npm run worker
    # SIGTERM lets the current wakeup finish. A run has an 8 minute deadline, past this limit
    # the platform kills it and another worker reclaims the wakeup after 10 minutes.
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      # "off" publishes every queued photo with the soft circle and never loads the cat model.
      - key: CAT_FINDER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stray-fund-db
          property: connectionString
      - key: AWS_REGION
        value: ap-southeast-1
      # No AWS keys: Render's OIDC token assumes this IAM role (needs a Pro workspace). Render sets
      # AWS_WEB_IDENTITY_TOKEN_FILE itself; never set it by hand. See docs/deploy.md step 2.
      - key: AWS_ROLE_ARN
        sync: false
      - key: AI_MODEL
        value: global.anthropic.claude-haiku-4-5-20251001-v1:0
      - key: AI_DAILY_CALL_CAP
        value: "100"
      - key: S3_PRIVATE_BUCKET
        sync: false
      - key: S3_PUBLIC_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # Never set to production here (docs/deploy.md, Before real money).
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

databases:
  - name: stray-fund-db
    region: singapore
    plan: 0.1c-256mb
    # Photos live in S3, so the database only holds rows. 1 GB is the smallest size.
    diskSizeGB: 1
    databaseName: strayfund
